<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="DuTheuDev">
        <meta name="date" content="2026-09-22" scheme="YYYY-MM-DD">
        <link rel="stylesheet" type="text/css" href="styles.css">
        <title>Hamburgueria Primos</title>
    </head>

    <body>
        <nav>
            <img src="logo.png" alt="Logo da DuTheuDev" id="logomenu">
            <div id="forms-trabalheaqui">
                <form>
                    <label for="txtNome">Nome:</label>
                    <input type="text" name="txtNome" id="txtNome" size="30" maxlength="50" placeholder="Digite aqui seu nome completo">

                    <label for="numTele">Número de telefone:</label>
                    <input id="numTele" name="numTele" type="text" placeholder="(XX) X XXXX-XXXX">
                </form>
            </div>
            <div>
                Menu rápido:
                <ul>
                    <li>
                        <a href="#hamb">Hambúrguer</a>
                        <div class="oculto">
                            <ul>
                                <li>
                                    <a href="#hambcasa">Hambúrguer da Casa</a>
                                </li>
                                <li>
                                    <a href="#hamb2">X-Bacon Duplo</a>
                                </li>
                                <li>
                                    <a href="#hamb3">Hambúrguer Duplo</a>
                                </li>
                            </ul>
                            
                        </div>
                    </li>
                    <li>
                        <a href="#hotdog">Hot-dogs</a>
                        <div class="oculto">
                            <ul>
                                <li>
                                    <a href="#dogcasa">Hot-dog da Casa</a>
                                </li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </div>
        </nav>

        <main>
            <div class="cardapio"  id="hamb">
                Hambúrgueres:
                <ul>
                    <li>
                        <span id="hambcasa"><img src="hamb1.jpg" alt="Hambúrguer com 200g de carne e queijo cheedar">Hambúrguer da Casa</span>
                    </li>
                    <li>
                        <span id="hamb2"><img src="hamb2.jpg" alt="Hambúrguer com duas carnes de 200g, bacon e queijo cheedar">X-Bacon Duplo</span>
                    </li>
                    <li>
                        <span id="hamb3"><img src="hamb3.jpg" alt="Hambúrguer com duas carnes de 200g e queijo cheedar">Hambúrguer Duplo</span>
                    </li>
                </ul>
            </div>
            <div class="cardapio" id="hotdog">
                Hot-dogs:
                <ul>
                    <li>
                        <span id="dogcasa"><img src="dog1.jpg" alt="Hot-dog simples, salsicha ao molho com mostarda">Hot-dog da Casa</span>
                    </li>
                </ul>
            </div>
        </main>

        <footer>
            
        </footer>
