<!DOCTYPE html>
<html lang="pt=br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0">
        <title>Formulário de Teste</title>
    </head>
    <body>
        <form>
            <fieldset id="Cadastro de Pessoa">
                <legend>Cadastro de Pessoa</legend>
                <div>
                    <label for="txtNome">Nome:</label> <input type="text" name="nNome" id="txtNome" size="40" maxlength="50" placeholder="Digite seu nome">
                </div>
                <div>
                    <label for="txtEmail">eMail:</label> <input type="email" name="nEmail" id="txtEmail" size="20" placeholder="Digite seu email">
                </div>
                <div>
                    <label for="numIdade">Idade:</label> <input type="number" name="nIdade" id="numIdade" min="1" max="120">
                </div>
                <div>Data de Nascimento:</div>
                <div>Sexo: Masculino Feminino</div>
                <div>Estado:</div>
                <div>Cidade:</div>
                <div>Fale sobre você:</div>
                <div>Cor da camiseta:</div>
                <div>Nível de conhecimento de inglês: baixo alto</div>
                <div>Quero receber emails com notícias</div>
            </fieldset>
        </form>
    </body>
</html>
