<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0">
        <link rel="shortcut icon" href="logo.ico" type="image/x-icon">
        <title>Formulário de Teste</title>
    </head>
    <body>
        <!--o action não funciona pois o método post envia os dados para o index.html mas o index.html não tem como utilizar desses dados, por isso o erro 405, solução: integrar banco de dados ou armazenar localmente os dados usando js-->
        <form
            action="index.html" 
            method="post">

            <fieldset id="Cadastro de Pessoa">
                <legend>Cadastro de Pessoa</legend>
                <div>
                    <label for="txtNome">Nome:</label> <input type="text" name="nNome" id="txtNome" size="40" maxlength="50" placeholder="Digite seu nome">
                </div>
                <div>
                    <label for="txtEmail">eMail:</label> <input type="email" name="nEmail" id="txtEmail" size="20" placeholder="Digite seu email">
                </div>
                <div>
                    <label for="numIdade">Idade:</label> <input type="number" name="nIdade" id="numIdade" min="18" max="120">
                </div>
                <div>
                    <label for="dateNasc">Data de Nascimento:</label> <input type="date" name="dNasc" id="dateNasc">
                </div>
                <div>
                    Sexo:
                    <input type="radio" name="sexo" id="opM">
                    <label for="opM">Masculino</label>
                    
                    <input type="radio" name="sexo" id="opF">
                    <label for="opF">Feminino</label>
                </div>
                <div>
                    <label for="estado">Digite ou selecione o Estado:</label>
                    <input list="estados-brasil" id="estado" name="estado" placeholder="Ex: Paraná">
                    <datalist id="estados-brasil">
                        <option value="Acre (AC)">
                        <option value="Alagoas (AL)">
                        <option value="Amapá (AP)">
                        <option value="Amazonas (AM)">
                        <option value="Bahia (BA)">
                        <option value="Ceará (CE)">
                        <option value="Distrito Federal (DF)">
                        <option value="Espírito Santo (ES)">
                        <option value="Goiás (GO)">
                        <option value="Maranhão (MA)">
                        <option value="Mato Grosso (MT)">
                        <option value="Mato Grosso do Sul (MS)">
                        <option value="Minas Gerais (MG)">
                        <option value="Pará (PA)">
                        <option value="Paraíba (PB)">
                        <option value="Paraná (PR)">
                        <option value="Pernambuco (PE)">
                        <option value="Piauí (PI)">
                        <option value="Rio de Janeiro (RJ)">
                        <option value="Rio Grande do Norte (RN)">
                        <option value="Rio Grande do Sul (RS)">
                        <option value="Rondônia (RO)">
                        <option value="Roraima (RR)">
                        <option value="Santa Catarina (SC)">
                        <option value="São Paulo (SP)">
                        <option value="Sergipe (SE)">
                        <option value="Tocantins (TO)">
                    </datalist>
                </div>
                <!--vou precisar criar um jeito depois pra isso aqui pelo JS, por enquanto a pessoa vai escrever a cidade-->
                <div>
                    <label for="txtCidade">Cidade:</label>
                    <input type="text" name="txtCity" id="txtCidade" size="40" maxlength="50" placeholder="Ex: Andradina">
                </div>
                <div>
                    <label for="txtSobre">Fale sobre você:</label>
                    <input type="text" name="textoSobre" id="txtSobre" size="90" maxlength="500">
                </div>
                <div>
                    <label for="colorSuit">Cor da camiseta:</label>
                    <input type="color" name="corCamisa" id="colorSuit" value="#0000FF">
                </div>
                <div>
                    <label for="nivelIngles">Nível de conhecimento de inglês:</label> 
                    baixo <input type="range" min="0" max="10" step="2" id="nivelIngles"> alto
                </div>
                <div>
                    <input type="checkbox" name="chkNoticias" id="chkNoticias" checked>Quero receber emails com notícias
                </div>
                <div>
                    <input type="reset">
                    <input type="submit">
                </div>
            </fieldset>
        </form>
    </body>
</html>
